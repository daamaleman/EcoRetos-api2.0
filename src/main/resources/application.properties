spring.application.name=ecoretos-api

# ---------- Base de datos (PostgreSQL / Supabase) ----------
# En Railway se definen las variables DB_URL, DB_USER y DB_PASSWORD.
# Los valores después de ":" son los de desarrollo local.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecoretos}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pocas conexiones: el pooler gratuito de Supabase tiene un límite bajo
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# update: crea/ajusta las tablas automáticamente a partir de las entidades
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ---------- Servidor ----------
# Railway asigna el puerto en la variable PORT
server.port=${PORT:8080}
server.address=0.0.0.0
# Respeta los encabezados del proxy de Railway (para generar URLs https correctas)
server.forward-headers-strategy=framework

# ---------- Archivos ----------
upload.dir=${UPLOAD_DIR:uploads/evidencias}
# URL pública del API (opcional). Si se deja vacía, se toma de la petición.
app.public-url=${PUBLIC_URL:}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
